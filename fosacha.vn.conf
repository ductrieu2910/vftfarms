<VirtualHost *:80>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/fosacha.vn"
    ServerName 137df7ba.fosacha.vn
    ServerAlias fosacha.vn www.fosacha.vn
    #errorDocument 404 /404.html
    ErrorLog "/www/wwwlogs/fosacha.vn-error_log"
    CustomLog "/www/wwwlogs/fosacha.vn-access_log" combined

    #DENY FILES
     <Files ~ (\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md)$>
       Order allow,deny
       Deny from all
    </Files>
    
    #PHP
    <FilesMatch \.php$>
            SetHandler "proxy:unix:/tmp/php-cgi-74.sock|fcgi://localhost"
    </FilesMatch>
    
    #PATH
    <Directory "/www/wwwroot/fosacha.vn">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.html default.htm
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/fosacha.vn/"
    ServerName SSL.fosacha.vn
    ServerAlias www.fosacha.vn fosacha.vn 
    #errorDocument 404 /404.html
    ErrorLog "/www/wwwlogs/fosacha.vn-error_log"
    CustomLog "/www/wwwlogs/fosacha.vn-access_log" combined
    
    #SSL
    SSLEngine On
    SSLCertificateFile /www/cert/fosacha.vn/fullchain.pem
    SSLCertificateKeyFile /www/cert/fosacha.vn/privkey.pem
    SSLCipherSuite EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5
    SSLProtocol All -SSLv2 -SSLv3 -TLSv1
    SSLHonorCipherOrder On
    
    
    #PHP
    <FilesMatch \.php$>
            SetHandler "proxy:unix:/tmp/php-cgi-74.sock|fcgi://localhost"
    </FilesMatch>
    

    #DENY FILES
     <Files ~ (\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md)$>
       Order allow,deny
       Deny from all
    </Files>

    #PATH
    <Directory "/www/wwwroot/fosacha.vn/">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.html default.htm
    </Directory>
</VirtualHost>