# Rewrite rules cho nginx/openresty (aaPanel) — tương đương 3 file .htaccess
# (/, /hq/, /delivery/). nginx KHÔNG đọc .htaccess nên phải khai báo ở đây.
#
# Cách dùng trên aaPanel: Website -> vftfarms.com -> Conf (Cấu hình)
#   -> URL rewrite -> dán toàn bộ nội dung file này -> Save.
# (aaPanel tự include vào server{} và reload nginx.)
#
# Quy tắc giống Apache: URL nào không phải là FILE có thật thì chuyển cho
# index.php của thư mục đó (kể cả thư mục như /document/ — phải đi qua
# index.php gốc để nạp config.php, nếu không sẽ lỗi 500).

location /hq/ {
    if (!-f $request_filename) {
        rewrite ^ /hq/index.php last;
    }
}

location /delivery/ {
    if (!-f $request_filename) {
        rewrite ^ /delivery/index.php last;
    }
}

location / {
    if (!-f $request_filename) {
        rewrite ^ /index.php last;
    }
}
